                  - columnheader "说明" [ref=f5e1006]
                  - columnheader "类型" [ref=f5e1007]
                  - columnheader "默认值" [ref=f5e1008]
              - rowgroup [ref=f5e1009]:
                - row [ref=f5e1010]:
                  - cell [ref=f5e1011]:
                    - code [ref=f5e1012]: Component
                    - text: (可以是任意 antd 组件名，如
                    - code [ref=f5e1013]: Button
                    - text: )
                  - cell "用于修改 Component Token 以及覆盖该组件消费的 Alias Token" [ref=f5e1014]
                  - cell [ref=f5e1015]:
                    - code [ref=f5e1016]: "ComponentToken & AliasToken & { algorithm: boolean | (token: SeedToken) => MapToken"
                    - text: "|"
                    - code [ref=f5e1017]: "((token: SeedToken) => MapToken)[]}"
                  - cell "-" [ref=f5e1018]
            - blockquote [ref=f5e1019]:
              - paragraph [ref=f5e1020]:
                - text: 组件级别的
                - code [ref=f5e1021]: algorithm
                - text: 默认为
                - code [ref=f5e1022]: "false"
                - text: ，此时组件 Token 仅仅会覆盖该组件使用的 token，不会进行派生计算。设置为
                - code [ref=f5e1023]: "true"
                - text: 时会继承当前全局算法；也可以和全局的
                - code [ref=f5e1024]: algorithm
                - text: 一样传入一个或多个算法，这将会针对该组件覆盖全局的算法。
