            - heading "基本概念" [level=2] [ref=f5e857]:
              - link [aria-hidden] [ref=f5e858] [cursor=pointer]:
                - /url: "#design-token"
              - text: 基本概念
            - paragraph [ref=f5e859]: 在 Design Token 中我们提供了一套更加贴合设计的三层结构，将 Design Token 拆解为 Seed Token、Map Token 和 Alias Token 三部分。这三组 Token 并不是简单的分组，而是一个三层的派生关系，由 Seed Token 派生 Map Token，再由 Map Token 派生 Alias Token。在大部分情况下，使用 Seed Token 就可以满足定制主题的需要。但如果您需要更高程度的主题定制，您需要了解 antd 中 Design Token 的生命周期。
            - heading "演变过程" [level=3] [ref=f5e860]:
