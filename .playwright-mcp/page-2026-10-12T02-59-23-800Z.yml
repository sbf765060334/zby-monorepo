        - generic [ref=f5e299]:
          - generic [ref=f5e300]:
            - paragraph [ref=f5e301]: Ant Design 设计规范和技术上支持灵活的样式定制，以满足业务和品牌上多样化的视觉需求，包括但不限于全局样式（主色、圆角、边框）和指定组件的视觉定制。
            - paragraph [ref=f5e302]: 自从 5.0 版本以来，我们提供了一套全新的定制主题方案。不同于 4.x 版本的 less 和 CSS 变量，有了 CSS-in-JS 的加持后，动态主题的能力也得到了加强，包括但不限于：
            - list [ref=f5e303]:
              - listitem [ref=f5e304]: 支持动态切换主题；
              - listitem [ref=f5e305]: 支持同时存在多个主题；
              - listitem [ref=f5e306]: 支持针对某个/某些组件修改主题变量；
              - listitem [ref=f5e307]: ...
            - heading "配置主题" [level=2] [ref=f5e308]:
              - link [aria-hidden] [ref=f5e309] [cursor=pointer]:
                - /url: "#basic-usage"
              - text: 配置主题
            - paragraph [ref=f5e310]:
              - text: 我们把影响主题的最小元素称为
              - strong [ref=f5e311]: Design Token
              - text: 。通过修改 Design Token，我们可以呈现出各种各样的主题或者组件。通过在
              - code [ref=f5e312]: ConfigProvider
              - text: 中传入
              - code [ref=f5e313]: theme
              - text: 属性，可以配置主题。
          - alert [ref=f5e314]:
            - img "exclamation-circle" [ref=f5e316]
            - generic [ref=f5e319]:
              - generic [ref=f5e320]: WARNING
              - generic [ref=f5e322]:
                - paragraph [ref=f5e323]:
                  - code [ref=f5e324]: ConfigProvider
                  - text: 对
                  - code [ref=f5e325]: message.xxx
                  - text: 、
                  - code [ref=f5e326]: Modal.xxx
                  - text: 、
                  - code [ref=f5e327]: notification.xxx
                  - text: 等静态方法不会生效，原因是在这些方法中，antd 会通过
                  - code [ref=f5e328]: ReactDOM.render
                  - text: 动态创建新的 React 实体。其 context 与当前代码所在 context 并不相同，因而无法获取 context 信息。
                - paragraph [ref=f5e329]:
                  - text: 当你需要 context 信息（例如 ConfigProvider 配置的内容）时，可以通过
                  - code [ref=f5e330]: Modal.useModal
                  - text: 方法返回 modal 实体以及 contextHolder 节点，将其插入到你需要获取 context 位置即可。也可通过
                  - link "App 包裹组件" [ref=f5e331] [cursor=pointer]:
                    - /url: /components/app-cn
                  - text: 简化 useModal 等方法需要手动植入 contextHolder 的问题。
